[package]
name = "xpclrs"
version = "1.0.3"
authors = ["Andrea Talenti"]
edition = "2021"
license = "MIT"
repository = "https://github.com/RenzoTale88/xpclrs"
readme = "README.md"
keywords = ["genome", "bioinformatics", "sequencing", "selection"]
categories = ["science::bioinformatics"]
description = "A high-performance rust implementation of the XP-CLR method."

[dependencies]
anyhow           = "1.0.104"
clap             = "4.6.6"
counter          = "0.7.1"
env_logger       = "0.11.11"
flate2           = "1.1.9"
itertools        = "0.15.0"
log              = "0.4.33"
niffler          = "2.5.0"
rand             = "0.10.2"
rayon            = "1.12.0"
rust-htslib      = "1.0.1"
rustc-hash       = "2.1.3"
scirs2-integrate = { version = "0.6.5", features = ["parallel", "simd"] }
statistical      = "1.0.0"
statrs           = "0.19.0"
